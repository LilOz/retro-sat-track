[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-sat-track"
version = "0.1.0"
description = "A local retro satellite tracking terminal powered by CelesTrak"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "skyfield>=1.49,<2", "httpx>=0.27,<1"]

[dependency-groups]
dev = [
    "black>=26,<27",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["ANN", "E4", "E7", "E9", "F", "I"]
